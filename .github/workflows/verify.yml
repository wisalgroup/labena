name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV_FILE: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/... ./examples/...
      - name: Verify generated application
        run: |
          if [ -d cmd/labena ]; then
            target="$RUNNER_TEMP/labena-smoke"
            go run ./cmd/labena new "$target" --module example.com/myapp --name MyApp --source .
            cd "$target"
            test -f .env.example
            GOWORK=off go test ./internal/app/config ./tests/architecture
          fi
      - name: Verify shared application image
        run: docker build --platform linux/amd64 -f deployments/Dockerfile .
      - run: go test docs/build.go docs/highlight_test.go
      - name: Verify generated guides
        run: |
          go run docs/build.go
          git diff --exit-code -- docs
          test -z "$(git ls-files --others --exclude-standard docs)"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV_FILE: ''
      DATABASE_TEST_POSTGRES: postgres://postgres:test-only@localhost:5432/postgres?sslmode=disable
      QUEUE_TEST_REDIS: redis://localhost:6379/5
      RATE_LIMIT_TEST_REDIS: redis://localhost:6379/2
      CACHE_TEST_REDIS: redis://localhost:6379/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Required PostgreSQL and Redis suites
        run: ./scripts/verify-integration.sh
