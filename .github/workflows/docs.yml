name: Publish documentation

# Enable GitHub Pages with the GitHub Actions source, then run this workflow.
# Manual publication also lets application owners choose whether to expose their guides.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test and build documentation
        run: |
          go test docs/build.go docs/highlight_test.go
          go run docs/build.go
      - name: Package the public site
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil

          docs = Path("docs")
          site = Path(os.environ["RUNNER_TEMP"]) / "labena-docs"
          (site / "markdown").mkdir(parents=True)
          navigation = json.loads((docs / "navigation.json").read_text())
          for section in navigation:
              for page in section["pages"]:
                  slug = page["slug"]
                  shutil.copyfile(docs / f"{slug}.html", site / f"{slug}.html")
                  shutil.copyfile(docs / "markdown" / f"{slug}.md", site / "markdown" / f"{slug}.md")
          for name in ("style.css", "app.js", "visuals.js", "search-index.js"):
              shutil.copyfile(docs / name, site / name)
          shutil.copytree(docs / "vendor", site / "vendor")
          (site / ".nojekyll").touch()
          print(f"Packaged documentation in {site}")
          PY
      - name: Upload the site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/labena-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
