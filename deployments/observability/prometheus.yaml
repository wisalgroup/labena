global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: labena
    scrape_timeout: 5s
    sample_limit: 50000
    static_configs:
      - targets: ['api:9090']
  - job_name: observability
    scrape_timeout: 5s
    sample_limit: 50000
    static_configs:
      - targets: ['prometheus:9090', 'alloy:12345', 'loki:3100', 'tempo:3200']
