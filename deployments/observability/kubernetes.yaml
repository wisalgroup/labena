# Optional single-node Docker Desktop development stack, loaded by Tilt.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: labena-dev
  labels:
    app: grafana
    part-of: observability
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: labena-dev
  labels:
    app: grafana
    part-of: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: grafana/grafana:13.2.2
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
          readOnly: true
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
          subPath: dashboards.yaml
          readOnly: true
        - name: config
          mountPath: /var/lib/grafana/dashboards/overview.json
          subPath: overview.json
          readOnly: true
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 12
        env:
        - name: GOMEMLIMIT
          value: 700MiB
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'true'
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: Viewer
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: 'false'
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: local-development-only
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
        - name: GF_PLUGINS_PREINSTALL_DISABLED
          value: 'true'
        - name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE
          value: 'false'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: config
        configMap:
          name: grafana-config
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: labena-dev
  labels:
    app: grafana
    part-of: observability
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: labena-dev
  labels:
    app: prometheus
    part-of: observability
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: labena-dev
  labels:
    app: prometheus
    part-of: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: prom/prometheus:v3.15.0
        ports:
        - name: http
          containerPort: 9090
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /prometheus
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/prometheus.yaml
          subPath: prometheus.yaml
          readOnly: true
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 12
        args:
        - --config.file=/etc/prometheus.yaml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=24h
        - --storage.tsdb.retention.size=1GB
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: config
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: labena-dev
  labels:
    app: prometheus
    part-of: observability
spec:
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
---
