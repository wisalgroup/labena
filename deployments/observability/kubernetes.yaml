apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alloy-data
  namespace: labena-dev
  labels:
    app: alloy
    part-of: observability
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: labena-dev
  labels:
    app: alloy
    part-of: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alloy
        image: grafana/alloy:v1.20.1
        ports:
        - name: http
          containerPort: 12345
        - name: otlp-http
          containerPort: 4318
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/lib/alloy
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/alloy/config.alloy
          subPath: alloy.alloy
          readOnly: true
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 12
        args:
        - run
        - --server.http.listen-addr=0.0.0.0:12345
        - --storage.path=/var/lib/alloy
        - /etc/alloy/config.alloy
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: alloy-data
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: config
        configMap:
          name: alloy-config
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: labena-dev
  labels:
    app: alloy
    part-of: observability
spec:
  selector:
    app: alloy
  ports:
  - name: http
    port: 12345
    targetPort: http
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
