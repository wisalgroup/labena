apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: go-modular-dev
resources:
  - kubernetes.yaml
configMapGenerator:
  - name: prometheus-config
    files: [prometheus.yaml]
  - name: tempo-config
    files: [tempo.yaml]
  - name: loki-config
    files: [loki.yaml]
  - name: alloy-config
    files: [alloy.alloy]
  - name: grafana-config
    files:
      - grafana/provisioning/datasources/datasources.yaml
      - grafana/provisioning/dashboards/dashboards.yaml
      - grafana/dashboards/overview.json
