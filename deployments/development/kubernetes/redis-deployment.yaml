apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: labena-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: redis
        image: redis:7.4.2-alpine
        ports:
        - name: client
          containerPort: 6379
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        command:
        - redis-server
        - --appendonly
        - 'yes'
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 5
          timeoutSeconds: 5
        startupProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: labena-dev
spec:
  selector:
    app: redis
  ports:
  - name: client
    port: 6379
    targetPort: client
