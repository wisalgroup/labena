apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: go-modular-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      automountServiceAccountToken: false
      containers:
      - name: nats
        image: nats:2.11.9-alpine
        args:
        - -js
        - -sd
        - /data
        - --http_port
        - "8222"
        ports:
        - name: client
          containerPort: 4222
        - name: monitoring
          containerPort: 8222
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          tcpSocket:
            port: client
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: nats-data
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: go-modular-dev
spec:
  selector:
    app: nats
  ports:
  - name: client
    port: 4222
    targetPort: client
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
  namespace: go-modular-dev
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
