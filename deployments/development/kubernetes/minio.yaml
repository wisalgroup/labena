apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: labena-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: minio
        image: labena-minio
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: FILESYSTEM_MINIO_ACCESS_KEY_ID
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: FILESYSTEM_MINIO_SECRET_ACCESS_KEY
        ports:
        - name: s3
          containerPort: 9000
        - name: console
          containerPort: 9001
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: s3
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: s3
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /minio/health/live
            port: s3
          periodSeconds: 2
          failureThreshold: 60
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: labena-dev
spec:
  selector:
    app: minio
  ports:
  - name: s3
    port: 9000
    targetPort: s3
  - name: console
    port: 9001
    targetPort: console
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: labena-dev
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
