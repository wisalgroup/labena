# Full development profile. Go owns tuning defaults; secrets own credentials.
# Reference: deployments/configuration.md. Tilt starts MinIO and observability.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: labena-dev
data:
  APP_ENV_FILE: ""
  APP_ENV: "development"
  APP_NAME: "labena"
  LOG_CHANNELS: "stderr,file,observability"
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "http://alloy:4318/v1/logs"

  # Optional local viewer at /admin/logs/. Works without the observability channel.
  LOG_VIEWER_ENABLED: "true"
  LOG_VIEWER_USERNAME: "admin"
  LOG_VIEWER_PASSWORD: "admin"

  HTTP_DOCS_ENABLED: "true"
  HTTP_CORS_ENABLED: "true"
  HTTP_CORS_ALLOW_ORIGINS: "*"
  HTTP_READINESS_DEPENDENCIES: "true"
  API_RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REDIS_URL: "redis://redis:6379/2"
  RATE_LIMIT_NAMESPACE: "labena-dev"
  DATABASE_DRIVER: "postgres"
  CACHE_DRIVER: "redis"

  # Endpoint and bucket are also consumed by the MinIO initialization container.
  FILESYSTEM_DISK: "minio"
  MEDIA_BASE_URL: "http://localhost:8080/api/v1/media"
  FILESYSTEM_MINIO_ENDPOINT: "http://minio:9000"
  FILESYSTEM_MINIO_VISIBILITY: "public"
  FILESYSTEM_MINIO_URL_MODE: "internal"
  FILESYSTEM_MINIO_PUBLIC_URL: "http://localhost:9000/uploads"
  FILESYSTEM_MINIO_BUCKET: "uploads"

  EVENTS_DRIVER: "gochannel"
  QUEUE_REDIS_URL: "redis://redis:6379/1"
  # Exactly one app process owns recurring schedules in this development stack.
  QUEUE_DASHBOARD_ENABLED: "true"

  # Mail is always available; SMTP connects only when sending.
  MAIL_HOST: "sandbox.smtp.mailtrap.io"
  MAIL_PORT: "2525"
  MAIL_FROM_ADDRESS: "no-reply@example.com"
  MAIL_FROM_NAME: "Labena"
  MAIL_BRAND_NAME: "Labena"
  MAIL_ACCENT_COLOR: "#1D4ED8"
  MAIL_LOGO_URL: "https://placehold.co/80x80/172554/FFFFFF.png?text=L"
  MAIL_WEBSITE_URL: "https://example.com"
  MAIL_SUPPORT_EMAIL: "support@example.com"
  MAIL_FOOTER: "Account updates, thoughtfully delivered."

  # .env.mail.yaml supplies MAIL_USERNAME, MAIL_PASSWORD, PUSH_EXPO_PROJECT_ID,
  # PUSH_EXPO_ACCESS_TOKEN and the other Identity/dashboard/media secrets.
  AUTH_ENABLED: "true"
  AUTH_GOOGLE_ENABLED: "true"
  PUSH_ENABLED: "true"

  TRACING_ENABLED: "true"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://alloy:4318/v1/traces"
  METRICS_ENABLED: "true"
  METRICS_ADDRESS: ":9090"
