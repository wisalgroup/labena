# Development credentials only. Replace with managed secrets for deployment.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-dev
  namespace: labena-dev
type: Opaque
stringData:
  POSTGRES_DB: labena
  POSTGRES_USER: demo
  POSTGRES_PASSWORD: local-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-dev
  namespace: labena-dev
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: demo
  RABBITMQ_DEFAULT_PASS: local-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: labena-dev
type: Opaque
stringData:
  DATABASE_URL: postgres://demo:local-demo@postgres:5432/labena?sslmode=disable
  CACHE_REDIS_URL: redis://redis:6379/0

  # Credentials for the selected local MinIO fixture.
  FILESYSTEM_MINIO_ACCESS_KEY_ID: "demo"
  FILESYSTEM_MINIO_SECRET_ACCESS_KEY: "local-demo-minio"
