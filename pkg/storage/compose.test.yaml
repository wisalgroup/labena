services:
  minio:
    image: go-modular-minio:local
    build:
      context: ../..
      dockerfile: deployments/development/docker/minio.Dockerfile
    command: server /data
    environment:
      MINIO_ROOT_USER: storage-test
      MINIO_ROOT_PASSWORD: storage-test-password
    ports:
      - "127.0.0.1:19000:9000"
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
